# Web (API + panel) y worker (colas SQS) sobre la misma imagen.
# Cada uno tiene su archivo de variables: credenciales IAM distintas (mail-api / mail-worker).
# Crear .env.web y .env.worker a partir de .env.example, con permisos 600.

services:
  web:
    build: .
    image: mail-service:latest
    env_file: .env.web
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  worker:
    image: mail-service:latest
    env_file: .env.worker
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    # Al recibir SIGTERM espera hasta 30 s los envíos en curso.
    stop_grace_period: 40s
    depends_on:
      web:
        condition: service_healthy
